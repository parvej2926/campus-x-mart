services:
  - type: web
    name: campus-x-mart-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: campus-x-mart-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://${{campus-x-mart-web.host}}"
      - key: EXPOSE_DEV_OTP
        value: false
  - type: web
    name: campus-x-mart-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://${{campus-x-mart-api.host}}"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: campus-x-mart-db
    plan: free
    databaseName: campusxmart
    user: campusxmart