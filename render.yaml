services:
  - type: web
    name: campus-x-mart-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: prod

      - key: DATABASE_URL
        fromDatabase:
          name: campus-x-mart-db
          property: connectionString

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: CORS_ORIGINS
        fromService:
          name: campus-x-mart-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: EXPOSE_DEV_OTP
        value: false

  - type: web
    name: campus-x-mart-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist

    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: campus-x-mart-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: campus-x-mart-db
    plan: free
    databaseName: campusxmart
    user: campusxmart